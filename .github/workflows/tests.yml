name: Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check deployment shell syntax
        run: bash -n scripts/wait-core.sh scripts/install-core.sh scripts/update-core.sh scripts/deploy-to-core.sh scripts/check-core.sh scripts/service-core.sh scripts/start-core.sh scripts/stop-core.sh scripts/restart-core.sh scripts/status-core.sh scripts/install-ace-step.sh scripts/start-ace-step.sh scripts/stop-ace-step.sh scripts/check-ace-step.sh
      - name: Validate live smoke tester syntax
        run: python3 -m py_compile scripts/smoke-core.py
      - name: Check real browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          source = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/pocket-orchestra-browser.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/pocket-orchestra-browser.js
      - name: Run tests
        run: |
          uv sync --extra dev --python 3.12
          uv run pytest -q
